name: Deploy invitation to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'dist/**'
      - 'scripts/prepare-github-pages.mjs'
      - '.github/workflows/deploy-pages.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepare static files and share metadata
        run: npm run build:pages
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .artifacts/github-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
