<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>지훈 · 지형 카카오톡 공유 이미지</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#f7f3eb}
    .card{width:1200px;height:630px;display:grid;grid-template-columns:390px 810px;color:#493b2c}
    .photo{width:390px;height:630px;object-fit:cover;object-position:50% 40%;display:block}
    .details{padding:47px 54px 38px;font-family:'Noto Sans KR',sans-serif;position:relative}
    .names{font-family:'Noto Serif KR',serif;font-size:57px;font-weight:500;letter-spacing:-2px;margin:0;line-height:1.35}
    .names span{font-size:32px;color:#a68655;vertical-align:7px;margin:0 5px}
    .invitation{font-size:27px;color:#907956;letter-spacing:4px;margin:12px 0 26px}
    .rule{height:1px;background:#d7c9b2;margin-bottom:25px}
    .date{font-size:40px;font-weight:400;letter-spacing:-1px;margin:0;line-height:1.5}
    .time{font-size:57px;font-weight:600;letter-spacing:-2px;line-height:1.4;margin:0 0 24px}
    .venue{font-size:41px;font-weight:500;letter-spacing:-1.8px;margin:0;line-height:1.5;white-space:nowrap}
    .address{font-size:29px;font-weight:400;letter-spacing:-.6px;color:#796a56;line-height:1.6;margin:8px 0 0;white-space:nowrap}
    .bottom-rule{position:absolute;left:54px;bottom:35px;width:52px;height:2px;background:#a68655}
  </style>
</head>
<body><main class="card"><img class="photo" src="../dist/assets/wedding.jpg" alt="지훈과 지형"><section class="details"><h1 class="names">전지훈 <span>♥</span> 유지형</h1><p class="invitation">저희 두 사람, 결혼합니다</p><div class="rule"></div><p class="date">2027년 1월 2일 토요일</p><p class="time">오후 3시 30분</p><p class="venue">웨스턴베니비스 영등포</p><p class="address">서울 영등포구 국회대로 558</p><div class="bottom-rule"></div></section></main></body>
</html>
